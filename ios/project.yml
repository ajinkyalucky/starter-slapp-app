name: NammaMetro
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  NammaMetro:
    type: application
    platform: iOS
    sources: [NammaMetro]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.nammametro
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Namma Metro
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  NammaMetroTests:
    type: bundle.unit-test
    platform: iOS
    sources: [NammaMetroTests]
    dependencies:
      - target: NammaMetro
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  NammaMetro:
    build:
      targets:
        NammaMetro: all
    test:
      targets: [NammaMetroTests]
