<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>T-Shirt Selector Prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="phone">
      <header class="assistant">
        <div class="orb" aria-hidden="true"></div>
        <div class="bubble">
          <p id="assistant-text">
            Akshay, this tshirt will fall best on you.<br />
            Also, this is one of our best sellers.
          </p>
        </div>
      </header>

      <section class="stage">
        <div class="model">
          <img
            id="model-image"
            src=""
            alt="Model wearing the selected t-shirt"
          />
        </div>

        <div class="thumbs" role="listbox" aria-label="Choose a t-shirt">
          <!-- thumbs are injected by JS so they share state with the product card -->
        </div>

        <article class="product-card" id="product-card">
          <div class="product-card__image">
            <img id="product-image" src="" alt="" />
          </div>
          <div class="product-card__info">
            <h2 class="brand" id="product-brand"></h2>
            <p class="title" id="product-title"></p>
            <p class="price">
              <span class="price__now" id="product-price"></span>
              <span class="price__was" id="product-was"></span>
            </p>
            <button class="add-btn" aria-label="Add to bag">+</button>
          </div>
        </article>
      </section>

      <footer class="composer">
        <div class="chip">T-Shirt</div>
        <div class="composer__row">
          <button class="composer__plus" aria-label="Attach">+</button>
          <div class="composer__input" role="textbox" aria-label="Message"></div>
          <button class="composer__send" aria-label="Send">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path
                fill="none"
                stroke="white"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 19V5M5 12l7-7 7 7"
              />
            </svg>
          </button>
        </div>
      </footer>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
